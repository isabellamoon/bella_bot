<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벨라꼬붕 도움받기 (관리자 패널)</title>
  <link rel="icon" href="assets/avatar.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <img class="avatar" src="assets/avatar.png" alt="">
      <div>
        <h1>벨라꼬붕 도움받기</h1>
        <p class="sub">관리자 패널 · 보스 · 레이드 · 레기온 출석</p>
      </div>
      <div class="me" id="me"></div>
    </div>
  </header>

  <main id="app">
    <section id="login" class="card center" hidden>
      <h2>디스코드로 로그인</h2>
      <p class="muted">관리자는 관리 화면을, 길드원은 보스 현황 · 내 출석 · 버추얼 벨라를 볼 수 있어요.</p>
      <button id="btn-login" class="primary">디스코드로 로그인</button>
    </section>

    <section id="noguild" class="card center" hidden>
      <img src="assets/helper/smile.webp" alt="벨라" style="width:220px;max-width:70%;height:auto;margin:0 auto 12px;display:block">
      <p>저랑 친해지고 싶으면, 여기로 문의하세요</p>
      <p><a href="mailto:elab.a.cowork@gmail.com">elab.a.cowork@gmail.com</a></p>
    </section>

    <section id="main" hidden>
      <div class="toolbar">
        <select id="guild"></select>
        <nav class="tabs" id="tabs">
          <button data-tab="bosses" class="active">보스</button>
          <button data-tab="settings">설정</button>
          <button data-tab="battles">레기온</button>
          <button data-tab="attendance">출석</button>
          <button data-tab="admins">관리자</button>
          <button data-tab="servers" id="tab-servers" hidden>서버</button>
          <button data-tab="vbella">✒️ 버추얼 벨라</button>
        </nav>
      </div>
      <div id="view"></div>
    </section>
  </main>

  <footer class="ground" aria-hidden="true"></footer>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="helper-data.js"></script>
  <script src="helper.js"></script>
  <script src="setup-flows.js"></script>
  <script src="setup-helper.js"></script>
</body>
</html>
